name: hospital-agent

services:
  db:
    restart: unless-stopped
    image: postgres:16
    environment:
      POSTGRES_USER: hospital_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hospital_owner_dev}
      POSTGRES_DB: hospital
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-hospital_app_dev}
    ports:
      - "127.0.0.1:54322:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital_owner -d hospital"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    environment:
      # The four database URLs default to the local db container below. Setting them in .env
      # (git-ignored) points the backend and the tests at a managed Postgres such as AWS RDS
      # instead - run scripts/managed_db_bootstrap.py once against it first (CLAUDE.md).
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://hospital_app:${APP_DB_PASSWORD:-hospital_app_dev}@db:5432/hospital}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgresql+psycopg://hospital_owner:${POSTGRES_PASSWORD:-hospital_owner_dev}@db:5432/hospital}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:-postgresql+psycopg://hospital_app:${APP_DB_PASSWORD:-hospital_app_dev}@db:5432/hospital_test}
      TEST_MIGRATION_DATABASE_URL: ${TEST_MIGRATION_DATABASE_URL:-postgresql+psycopg://hospital_owner:${POSTGRES_PASSWORD:-hospital_owner_dev}@db:5432/hospital_test}
      WATCHFILES_FORCE_POLLING: "true"
      # LLM design §3: from .env (git-ignored). Without a key the Agent Orchestrator does not start.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      # Sub-project 19 (design D3): USD per 1M tokens for OPENAI_MODEL; empty keeps llm/pricing.py's table.
      LLM_PRICE_INPUT_PER_MTOK: ${LLM_PRICE_INPUT_PER_MTOK:-}
      LLM_PRICE_OUTPUT_PER_MTOK: ${LLM_PRICE_OUTPUT_PER_MTOK:-}
      # §18.3 demo IdP: both have a development default, so the demo runs without them.
      AUTH_SECRET: ${AUTH_SECRET:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo}
      # Sub-project 9: the read-only role other systems use for the patients table.
      READER_DB_PASSWORD: ${READER_DB_PASSWORD:-hospital_reader_dev}
      # Sub-project 10: CheckAppointment asks the owner's appointment-service when both are set
      # (in .env); unset, it stays on the mock. Neither is ever logged.
      APPOINTMENT_SERVICE_URL: ${APPOINTMENT_SERVICE_URL:-}
      APPOINTMENT_API_KEY: ${APPOINTMENT_API_KEY:-}
      # Sub-project 13: CheckDocuments asks the owner's document-service when both are set
      # (in .env); unset, it stays on the mock. Neither is ever logged.
      DOCUMENT_SERVICE_URL: ${DOCUMENT_SERVICE_URL:-}
      DOCUMENT_API_KEY: ${DOCUMENT_API_KEY:-}
    # host.docker.internal reaches the appointment-service published on the host's 8080
    # (Docker Desktop; on Linux this maps it to the bridge gateway).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # BACKEND_HOST_PORT: Windows can reserve 8000 after a reboot (a Hyper-V / WinNAT excluded
      # port range - `netsh interface ipv4 show excludedportrange protocol=tcp`), and then no
      # process may bind it. The UI does not care: it reaches the API as backend:8000 inside
      # the compose network. Only direct calls to the API from the host use this port.
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - .:/repo
    # serve.sh runs uvicorn --reload under a watchdog: when /health stops answering (a dead
    # worker the reloader never replaces), it exits and the restart policy brings the container
    # back. The healthcheck shows the same state in `docker ps`. `docker compose run` (the
    # tests) gives its own command and ignores both.
    command: ["sh", "/repo/backend/serve.sh"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)"]
      interval: 15s
      timeout: 8s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    restart: unless-stopped
    build: ./frontend
    environment:
      # Vite proxies /api to the backend, so the browser needs no CORS (UI design §2).
      VITE_API_PROXY_TARGET: http://backend:8000
      VITE_USE_POLLING: "true"
    ports:
      # Host port 5273: another project of the user's listens on localhost:5173 (IPv6).
      - "127.0.0.1:5273:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

volumes:
  pgdata:
