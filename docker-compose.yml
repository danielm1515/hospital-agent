name: hospital-agent

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hospital_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hospital_owner_dev}
      POSTGRES_DB: hospital
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-hospital_app_dev}
    ports:
      - "127.0.0.1:54322:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital_owner -d hospital"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://hospital_app:${APP_DB_PASSWORD:-hospital_app_dev}@db:5432/hospital
      MIGRATION_DATABASE_URL: postgresql+psycopg://hospital_owner:${POSTGRES_PASSWORD:-hospital_owner_dev}@db:5432/hospital
      TEST_DATABASE_URL: postgresql+psycopg://hospital_app:${APP_DB_PASSWORD:-hospital_app_dev}@db:5432/hospital_test
      TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://hospital_owner:${POSTGRES_PASSWORD:-hospital_owner_dev}@db:5432/hospital_test
      WATCHFILES_FORCE_POLLING: "true"
      # LLM design §3: from .env (git-ignored). Without a key the Agent Orchestrator does not start.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/repo
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      # Vite proxies /api to the backend, so the browser needs no CORS (UI design §2).
      VITE_API_PROXY_TARGET: http://backend:8000
      VITE_USE_POLLING: "true"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

volumes:
  pgdata:
